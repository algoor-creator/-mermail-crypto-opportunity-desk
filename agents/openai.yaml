interface:
  display_name: "Crypto Opportunity Desk"
  short_description: "Rank crypto grants, bounties, RFPs and partnerships from email by expected value."
  default_prompt: "Use $mermail-crypto-opportunity-desk to triage legitimate crypto opportunities in my Mermail inbox, rank them economically, and prepare the best human-reviewed next action."
dependencies:
  tools:
    - type: "mcp"
      value: "mermail"
      description: "Mermail workspace and mailbox MCP server"
      transport: "streamable_http"
      url: "https://console.mermail.app/mcp"
